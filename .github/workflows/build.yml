name: Build Aurify IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -project Aurify.xcodeproj \
            -scheme Aurify \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/AurifyDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/AurifyDerivedData/Build/Products/Release-iphoneos/Aurify.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/AurifyExport/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/AurifyExport/Payload/Aurify.app"
          cd "$RUNNER_TEMP/AurifyExport"
          /usr/bin/zip -qry Aurify-unsigned.ipa Payload
          test -s Aurify-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Aurify-unsigned-ipa
          path: ${{ runner.temp }}/AurifyExport/Aurify-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
