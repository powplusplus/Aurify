name: Build Aurify iOS App & Generate IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build iOS App with xcodebuild
        run: |
          xcodebuild -scheme Aurify \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath ./build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ./build/Build/Products -name "*.app" -o -name "Aurify" | head -n 1)
          echo "Found app path: $APP_PATH"
          if [ -d "$APP_PATH" ]; then
            cp -r "$APP_PATH" Payload/
          else
            mkdir -p Payload/Aurify.app
            cp -r $APP_PATH Payload/Aurify.app/
          fi
          zip -r Aurify.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aurify-iOS-v1.0.0.ipa
          path: Aurify.ipa
