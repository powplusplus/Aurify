name: Build Aurify iOS App & Generate IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build iOS App with xcodebuild
        run: |
          xcodebuild -scheme Aurify \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath ./build

      - name: Package into IPA with Info.plist
        run: |
          mkdir -p Payload/Aurify.app
          
          # Locate built executable or app bundle
          TARGET_BIN=$(find ./build/Build/Products -type f -name "Aurify" | head -n 1)
          echo "Found binary target at: $TARGET_BIN"
          
          if [ -f "$TARGET_BIN" ]; then
            cp "$TARGET_BIN" Payload/Aurify.app/Aurify
          elif [ -d "./build/Build/Products/Release-iphoneos/Aurify.app" ]; then
            cp -r ./build/Build/Products/Release-iphoneos/Aurify.app/* Payload/Aurify.app/
          fi
          
          # Embed Info.plist into Payload/Aurify.app/Info.plist
          cp Info.plist Payload/Aurify.app/Info.plist
          
          # Create PkgInfo and ensure execution permissions
          echo -n "APPL????" > Payload/Aurify.app/PkgInfo
          chmod +x Payload/Aurify.app/Aurify
          
          # Package IPA
          zip -r Aurify.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aurify-iOS-v1.0.0.ipa
          path: Aurify.ipa
